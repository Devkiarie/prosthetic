# Project-wide Gradle settings

# Increase JVM heap to avoid GC thrashing during Kotlin+Compose builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle build caching and parallel execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Android Jetifier (off — not needed for all-AndroidX project)
android.useAndroidX=true
android.enableJetifier=false

# Suppress AGP 8.7.3 compileSdk=35 warning (we are on 35, this is here for reference)
# android.suppressUnsupportedCompileSdk=36
