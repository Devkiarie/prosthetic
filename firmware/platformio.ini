; PlatformIO project for sEMG Prosthetic Hand
; Ian Kiarie — FYP ENE212-0069/2022 — JKUAT ECE
; Board: ESP32-S3-DevKitC-1-N8R8

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board options
board_build.partitions = huge_app.csv    ; larger app partition for TFLite
board_build.arduino.memory_type = qio_opi  ; use PSRAM via OPI

; Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Libraries
lib_deps =
    ; TensorFlow Lite for Microcontrollers (ESP32-optimised, includes ESP-NN)
    spaziochirale/Chirale_TensorFLowLite @ ^2.0.0
    ; PCA9685 PWM driver
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.0
    ; BLE (Arduino ESP32 built-in)

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM                    ; enable PSRAM
    -mfix-esp32-psram-cache-issue        ; PSRAM cache fix
    -DTENSORFLOW_LITE_STATIC_MEMORY      ; TFLite static allocator
    -DTF_LITE_STATIC_MEMORY
    -DCORE_DEBUG_LEVEL=1                 ; minimal debug output
    -Os                                  ; size optimisation

; Extra scripts
extra_scripts = pre:tools/copy_model.py
